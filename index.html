<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLUKÓZA - Glucose Tracking App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>GLUKÓZA</h1>
        <p>Your personal glucose tracking app</p>
    </header>
    <main>
        <section>
            <h2>Track your glucose</h2>
            <form id="glucoseForm">
                <label for="glucoseLevel">Enter your glucose level:</label>
                <input type="number" id="glucoseLevel" name="glucoseLevel" required>
                <button type="submit">Submit</button>
            </form>
        </section>
        <section id="log">
            <h2>Log</h2>
            <ul id="glucoseLog"></ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Caisersosecz. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
